name: CI

# Run this workflow every time a commit gets pushed to main or a pull request gets opened against main
on:
  push:
    branches:
      - master
  pull_request:
    branches: 
      - master

jobs:
    build:
        name: Call Azure Pipeline
        runs-on: ubuntu-latest
        steps:
        - name: Azure Pipelines Action
          uses: Azure/pipelines@v1
          with:
            azure-devops-project-url: https://michaellperry.visualstudio.com/Assisticant
            azure-pipeline-name: 'Build from GitHub'
            azure-devops-token: ${{ secrets.AZURE_DEVOPS_TOKEN }}

    build-and-test:
        name: Build and test (GitHub Actions)
        runs-on: windows-latest
        steps:
        - uses: actions/checkout@v4

        - name: Setup MSBuild
          uses: microsoft/setup-msbuild@v2

        - name: Setup NuGet
          uses: NuGet/setup-nuget@v2

        # windows-latest no longer ships the .NET Framework 4.5 targeting pack
        - name: Install .NET Framework 4.5 developer pack
          run: choco install netfx-4.5.2-devpack -y --no-progress

        # Android/iOS are excluded: classic Xamarin tooling is EOL (May 2024) and no
        # longer ships on hosted build images (confirmed by trying it on this runner).
        - name: Restore packages.config packages
          run: nuget restore Assisticant.UnitTest\packages.config -PackagesDirectory packages

        - name: Restore Assisticant.Netstandard
          run: msbuild Assisticant.Netstandard\Assisticant.Netstandard.csproj /t:Restore

        - name: Build core projects and tests
          run: |
            msbuild Assisticant.UnitTest\Assisticant.UnitTest.Portable.csproj /p:Configuration=Release /m /verbosity:minimal
            msbuild Assisticant.UnitTest\Assisticant.UnitTest.WPF.csproj /p:Configuration=Release /m /verbosity:minimal

        - name: Setup VSTest
          uses: darenm/Setup-VSTest@v1

        - name: Run tests
          run: vstest.console.exe "Assisticant.UnitTest\bin\Portable\Release\Assisticant.UnitTest.dll" "Assisticant.UnitTest\bin\Release\Assisticant.UnitTest.WPF.dll"